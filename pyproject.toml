[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "purple-star-charting"
version = "0.8.2"
description = "紫微斗数排盘与白话解读（传统术数文化学习工具）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shzyhao" }]
keywords = ["ziwei", "astrology", "chinese-astrology", "traditional-culture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["lunardate>=0.3.0"]

[project.optional-dependencies]
png = ["Pillow>=9.0"]
traditional = ["opencc>=1.1"]

[project.scripts]
purple-star = "purple_star.cli:main"

[tool.setuptools]
packages = ["purple_star"]

[tool.setuptools.package-data]
purple_star = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行宽由 formatter 控制，中文文档/表格不强制
    "UP031",  # 保留 % 格式化，便于与中文长文本对照
    "UP009",  # 允许文件头 coding 声明（中文项目常见）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试需先 sys.path.insert 再 import
"scripts/*" = ["E402"]  # 评测/基准脚本需先调整 sys.path

[tool.mypy]
python_version = "3.9"
files = ["purple_star"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false


[tool.coverage.run]
source = ["purple_star"]
omit = ["purple_star/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
